name: Gerar cobrinha

on:
  schedule:
    - cron: "0 3 * * *" # todo dia à meia-noite (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cobrinha.yml]

jobs:
  cobrinha:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # cobra em ciano como o nome; quadradinhos em tons de roxo como a animação
          outputs: |
            dist/cobrinha.svg?palette=github-light&color_snake=#0E7490&color_dots=#ebedf0,#d8c8f5,#b794f4,#804ADE,#5B21B6
            dist/cobrinha-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#3b1f5e,#5b2fa0,#804ADE,#A78BFA

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
